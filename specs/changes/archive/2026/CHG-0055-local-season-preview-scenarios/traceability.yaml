            scenario_title: Reject unsafe selection
        tasks: [T-0055-002, T-0055-003, T-0055-004, T-0055-005]
        tests: [TEST-0055-001, TEST-0055-002, TEST-0055-004, TEST-0055-007]
        production: [scripts/season_scenario_model.py, scripts/season_scenario_local.py, scripts/seed_season_scenarios.py]
      - requirement_id: REQ-0055-002
        requirement_title: Preview the phases of a season
        scenarios:
          - scenario_id: SCN-0055-004
            scenario_title: Off-season is visibly quiet
          - scenario_id: SCN-0055-005
            scenario_title: Fresh start has opportunities without standings
          - scenario_id: SCN-0055-006
            scenario_title: Mid-season has believable progress
        tasks: [T-0055-002, T-0055-003, T-0055-004, T-0055-005, T-0055-006]
