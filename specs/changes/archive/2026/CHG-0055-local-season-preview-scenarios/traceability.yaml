  TEST-0055-005: Read seasonal previews through real mission adapters
  TEST-0055-006: Display seasonal previews through the local service
  TEST-0055-007: Ensure local preview transport uses paginated reads and conditional writes
task_titles:
  T-0055-001: Specify safe seasonal previews
  T-0055-002: Prove preview generation and guards RED
  T-0055-003: Generate safe deterministic scenarios
  T-0055-004: Prove local adapter projection RED
  T-0055-005: Populate all preview projections
  T-0055-006: Verify real user journey and safety
  T-0055-007: Document switching and validate quality
  T-0055-008: Load mid-season locally and confirm
  T-0055-009: Consolidate approved scenario contract
