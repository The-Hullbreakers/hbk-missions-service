shared_work:
  - tasks: [T-0054-013, T-0054-014, T-0054-015, T-0054-016, T-0054-017]
    tests: [TEST-SEED-LANG-001, TEST-SEED-LANG-002]
    purpose: Version-bound English drafts for 24 racing and 12 PvP
      definitions; exact source Spanish, ids and economics unchanged;
      repeated seed preserves existing ContentEn, new versions require
      complete English; dry-run, CLI render/local bootstrap, and
      concurrent English changes fail closed. Human signoff and
      non-local execution separate.
  - tasks: [T-0054-018, T-0054-019]
    tests: [TEST-SEED-IAM-001]
    purpose: Constrain the existing seed role to GetItem for exact
      OFFER keys on the same table; preserve current write scope,
      do not grant OFFER Query/Scan or CONTRACT reads.
  - tasks: [T-0054-009]
    tests: [TEST-INF-LANG-002]
    purpose: Backfill rehearsal — reviewed per-version en translations
      carry their es source snapshot; reject frozen Spanish text drift
      even when version, objective ids, and rule count match; report
      unresolved records and prove es/economics untouched.
  - tasks: [T-0054-011]
    tests: [TEST-E2E-LANG-001]
    purpose: L3 gates — security, coverage >=90%, mutation, critical
      E2E, documentation, clean-up <150 lines, validate-sdd-change.sh.

# TEST ids
# TEST-DOM-LANG-001  Language/ParseLanguage: es default, en accepted,
#                    unsupported/empty/conflicting rejected
# TEST-DOM-LANG-002  publish completeness: both locales required,
#                    stable objective ids/rule order, atomic version
# TEST-DOM-LANG-003  q matches effective-language title+description
#                    incl. es fallback
# TEST-APP-LANG-001  read use cases resolve per-item effective language
#                    + content_language for all six endpoints' sources
# TEST-APP-LANG-002  draft accepts es-only / es+en atomically; publish
#                    surfaces completeness rejection
# TEST-APP-LANG-003  heterogeneous results report per-item language;
#                    search q uses effective language
# TEST-HTTP-LANG-001 ?lang= happy paths: en content, omitted->es,
#                    400 INVALID_QUERY_PARAMETER, lowercase contract
#                    detail, review-queue role gates preserved
# TEST-HTTP-LANG-002 served-language labels + Content-Language header
#                    only on homogeneous non-empty payloads; legacy fallback
#                    labeled es
# TEST-HTTP-LANG-003 bilingual draft POST compat + facets unaffected +
#                    q search over effective language end-to-end
# TEST-INF-LANG-001  bilingual item round-trip; legacy decode es-only;
#                    offer/contract freeze copies both locales
# TEST-INF-LANG-002  backfill rehearsal: en-only augmentation, version
#                    and source-es snapshot match, divergent frozen es
#                    unresolved, es/economics unchanged
# TEST-SEED-LANG-001  36 source-bound English drafts; complete ordered
#                     rules/objectives; unchanged identity and economics
# TEST-SEED-LANG-002  repeat seed preserves ContentEn and es on same
#                     version; offer/merit/race conflicts reject; new
#                     version atomic en; render and local bootstrap en
# TEST-SEED-IAM-001   existing seed role gets GetItem for OFFER keys
#                     only; no wider read or write access
# TEST-E2E-LANG-001  critical E2E: English offer read -> accept ->
