# TEST ids
# TEST-APP-FIN-003  adjudication start acquires lock+cutoff (retry keeps
#                   values); FREEZING pre-lock still credits; fence on credit port
# TEST-APP-FIN-004  stage->verify->commit; crash/retry resumes same attempt;
#                   zero-ranked -> empty manifest
# TEST-APP-PUB-001  manifest publisher: stable event_id, progress marks, mid-drain retry
# TEST-DOM-ADJ-002  credited-contract roster rule (uncredited frozen member excluded)
# TEST-DOM-ADJ-003  attempt identity + staged-set count/hash verification
# TEST-INF-ADJ-001  Acquire persists a stable lock identity and cutoff
#                   while the public season remains FREEZING
# TEST-INF-FACT-001 conditional PutItem staging (attribute_not_exists);
#                   identical-digest replay no-op; deterministic manifest
#                   key; bounded parallelism; 2-item commit tx
# TEST-INF-FACT-002 divergent staged digest -> ErrStagedFactConflict,
#                   never overwritten
# TEST-INF-FENCE-001 credit/contract mutation rejected under lock in same write
# TEST-APP-MCF-001  pre-lock approve/confirm credits; post-lock
#                   ErrSeasonAdjudicating, no writes, no false success
# TEST-INF-MCF-001  raced approval all-or-nothing; post-lock approve ->
#                   contract pending + ledger unchanged; reject unfenced
# TEST-INF-SNAP-001 strong-consistent standings + credited-contract snapshot
# TEST-E2E-AWD-002  200 ranked entries finalize -> manifest -> 200 facts (critical E2E)
